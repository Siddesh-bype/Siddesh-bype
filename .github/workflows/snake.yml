name: Generate Snake Contribution Animation

on:
  schedule:
    # Run once every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generates a snake game from a github user (<github_user_name>) contributions graph
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Strip bottom progress bar (.u rect elements) and crop canvas cleanly
      - name: Strip bottom progress bar from SVGs
        run: |
          sed -i -E 's/<rect class="u[^"]*"[^>]*>//g' dist/*.svg
          sed -i 's/viewBox="-16 -32 880 192"/viewBox="-16 -16 880 144"/g' dist/*.svg
          sed -i 's/height="192"/height="144"/g' dist/*.svg

      # Push the content of <build_dir> to the output branch
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
